<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard side bar menu</title>
    <link rel="stylesheet" href="dash.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
        <link rel="stylesheet" href="type.js">
</head>

<body>
    <nav class="hellobar">
        <header>
            <div class="image-text">
                <img src="OIP.jpeg" alt="">

                <div class="text header-image">
             <span class="class">
                chinmay wadhwa 
             </span>
             <span class="job_role">FRONTEND DEVLOPER</span>
                </div>
            </div>
            <i class='bx bxs-chevron-right-circle toggle'></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <ul class="menu-links">
                    <li class="search-box">
                        <a href="">
                            <i class='bx bx-search-alt-2'></i>
                            <input type="search" placeholder="search here">
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bxs-home icons'></i>
                            <span class="text nav-text">home</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bx-credit-card-front'></i>
                            <span class="text nav-text">revanue</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bx-bell' ></i></i>
                            <span class="text nav-text">notifications</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bx-headphone'></i></i>
                            <span class="text nav-text">contact us</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bxl-meta'></i>
                            <span class="text nav-text">social media </span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="">
                            <i class='bx bxs-cog'></i>
                            <span class="text nav-text">settings</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="bottom-contact">
                <li class="bottom">
                    <a href="">
                        <i class='bx bx-log-out'></i>
                        <span class="text nav-text">log out </span>
                    </a>
                </li>
                <li class="mode">
                    <div class="day-night">
                        <i class='bx bx-moon'></i>
                        <i class='bx bx-sun'></i>
                    </div>
                    <span class="dark">dark mode</span>
                    <div class="switch">
                        <span class="switch-toggle"></span>
                    </div>
                </li>
            </div>
        </div>
    </nav>

</body>

</html>
